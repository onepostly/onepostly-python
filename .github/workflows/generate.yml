name: Regenerate

on:
  repository_dispatch:
    types: [openapi-updated]

  # Fallback: reconcile the committed SDK against the live spec twice a day,
  # even if no dispatch arrives.
  schedule:
    - cron: "41 5,17 * * *"

  workflow_dispatch:

concurrency:
  group: regenerate-sdk
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate, release, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # PyPI trusted publishing
    environment: pypi

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21

      - name: Install generator and build tooling
        run: |
          pipx install openapi-generator-cli
          pip install build

      - name: Compute next version
        id: version
        run: |
          CURRENT=$(grep -oP '(?<=^version = ")[^"]+' pyproject.toml)
          NEXT=$(python -c "import sys; v='$CURRENT'.split('.'); v[-1]=str(int(v[-1])+1); print('.'.join(v))")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Version: $CURRENT -> $NEXT"

      # Generate into a scratch dir, then copy ONLY the package into src/.
      # The python generator emits a flat project (pyproject.toml, setup.py,
      # tests/, docs/, onepostly/) regardless of -o, so generating in-place
      # either overwrites maintained files or (with .openapi-generator-ignore
      # entries) silently writes nothing. -o tmp isolates the emission; the
      # package subdir is the only part we keep.
      - name: Regenerate from the live production spec
        run: |
          rm -rf /tmp/gen
          openapi-generator-cli generate \
            -i https://api.onepostly.com/openapi.json \
            -g python --library httpx -o /tmp/gen \
            -p packageVersion=${{ steps.version.outputs.next }},packageName=onepostly,projectName=onepostly
          rm -rf src/onepostly
          cp -r /tmp/gen/onepostly src/onepostly
          test -f src/onepostly/api/posts_api.py \
            || { echo "::error::Generated package missing from src/ after copy."; exit 1; }

      - name: Write version into pyproject.toml
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ steps.version.outputs.next }}\"/" pyproject.toml
          grep '^version' pyproject.toml

      # Idempotency gate: a deploy with no API change produces an empty diff
      # and the run exits here without committing or publishing anything.
      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- src/ pyproject.toml)" ]; then
            echo "No generated-code changes; SDK already matches the live spec."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dev dependencies
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-asyncio

      - name: Test
        if: steps.changes.outputs.has_changes == 'true'
        run: pytest

      - name: Commit regenerated code
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/ pyproject.toml
          git commit -m "chore: regenerate from OpenAPI spec

          - Auto-generated SDK updates
          - Version: v${{ steps.version.outputs.next }}"
          git show --stat HEAD

      # Back-to-back dispatches race for main; rebase with the regenerated
      # content winning (it was produced from a fresher spec fetch). Commit
      # above stages only tracked paths, so nothing blocks the rebase.
      - name: Push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing and retrying..."
            git pull --rebase -X theirs origin main
            sleep $((attempt * 5))
          done
          echo "::error::Could not push after 3 attempts."
          exit 1

      # Guard against re-publishing a version that already shipped. Queries
      # the PyPI JSON API directly: `pip index versions` also lists the local
      # editable install, which false-matches the freshly bumped version.
      - name: Check if version already published
        if: steps.changes.outputs.has_changes == 'true'
        id: check_published
        run: |
          NEXT=${{ steps.version.outputs.next }}
          if curl -sf "https://pypi.org/pypi/onepostly/$NEXT/json" > /dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version $NEXT is already on PyPI; skipping publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build distributions
        if: steps.changes.outputs.has_changes == 'true' && steps.check_published.outputs.skip != 'true'
        run: python -m build

      - name: Publish to PyPI
        if: steps.changes.outputs.has_changes == 'true' && steps.check_published.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        if: steps.changes.outputs.has_changes == 'true' && steps.check_published.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.next }}
          name: v${{ steps.version.outputs.next }}
          draft: false
          generate_release_notes: true
          body: |
            ## Auto-generated SDK update

            Regenerated from the latest OpenAPI spec.

            ```bash
            pip install onepostly==${{ steps.version.outputs.next }}
            ```
