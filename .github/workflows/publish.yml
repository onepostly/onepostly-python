name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # PyPI trusted publishing
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Release gate: regenerate from the live production OpenAPI document
      # and stop if the committed generated code no longer matches it.
      - name: Install generator
        run: pipx install openapi-generator-cli
      - name: Regenerate SDK from live production spec
        run: |
          openapi-generator-cli generate \
            -i https://api.onepostly.com/openapi.json \
            -g python --library httpx -o . \
            -p packageVersion=0.2.0,packageName=onepostly,projectName=onepostly
      - name: Fail if generated code drifted from production spec
        run: |
          git diff --exit-code -- src/ \
            || { echo "::error::Production spec drifted from the committed generated SDK. Regenerate, review, and re-tag."; exit 1; }
      - run: pip install -e ".[dev]" pytest-asyncio build
      - run: python -m build
      - run: pytest
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Installation

            ```bash
            pip install onepostly==${{ github.ref_name }}
            ```
